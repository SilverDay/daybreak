<VirtualHost *:443>
    ServerName daybreak.silverday.de
    DocumentRoot /srv/vhosts/daybreak.silverday.de/public

    <Directory /srv/vhosts/daybreak.silverday.de/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Everything above public/ (src, config, storage, migrations, bin) is NOT web-served.
    SSLEngine on
    # SSLCertificateFile / SSLCertificateKeyFile via your cert manager (e.g. certbot)

    ErrorLog  /var/log/apache2/daybreak_error.log
    CustomLog /var/log/apache2/daybreak_access.log combined
</VirtualHost>
