<VirtualHost *:443>
    ServerName daybreak.silverday.de
    DocumentRoot /srv/vhosts/daybreak.silverday.de/public

    <Directory /srv/vhosts/daybreak.silverday.de/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Production incident mitigation:
    # CRS RESPONSE-951 regexes can exceed PCRE limits on this app's rendered feed output.
    # Disable response-body inspection only for front-controller routes.
    <IfModule security2_module>
        SecRuleEngine On
        SecRule REQUEST_URI "@rx ^/(?:|index\.php)$" "id:1001001,phase:1,pass,nolog,ctl:responseBodyAccess=Off"
    </IfModule>

    <IfModule mod_headers.c>
        # Assets are URL-versioned (?v=mtime), so immutable long caching is safe.
        <LocationMatch "^/assets/">
            Header set Cache-Control "max-age=31536000, immutable"
        </LocationMatch>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    </IfModule>

    # Everything above public/ (src, config, storage, migrations, bin) is NOT web-served.
    SSLEngine on
    # SSLCertificateFile / SSLCertificateKeyFile via your cert manager (e.g. certbot)

    ErrorLog  /var/log/apache2/daybreak_error.log
    CustomLog /var/log/apache2/daybreak_access.log combined
</VirtualHost>
